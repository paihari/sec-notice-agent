[project]
name = "sec-notice-agent"
version = "0.1.0"
description = "Watch SEC EDGAR filings, analyse materiality with a Claude agent, and email alerts."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.2",
    "anthropic>=0.40",
    "yfinance>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
